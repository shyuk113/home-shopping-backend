services:
  app:
    build: .
    container_name: shop-backend-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: shop
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 3600000
      # t3.small(2GB)에서 PostgreSQL·Redis·Kafka와 메모리를 나눠 쓰므로 힙 상한을 명시
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
    depends_on:
      - postgres
      - redis
      - kafka

  postgres:
    image: postgres:16
    container_name: shop-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - shop-postgres-data:/var/lib/postgresql/data
    # 운영에서는 DB 포트를 외부에 열 필요가 없으면 ports 섹션 자체를 삭제해도 됨

  redis:
    image: redis:7
    container_name: shop-backend-redis
    restart: unless-stopped
  kafka:
    image: apache/kafka:3.9.0
    container_name: shop-backend-kafka
    restart: unless-stopped
    environment:
      # 단일 노드 KRaft (브로커 + 컨트롤러)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # 다른 컨테이너(app)가 접속할 주소. localhost로 두면 app 컨테이너가 자기 자신을 찾아감
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # 브로커 1대라 내부 토픽 복제 수도 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # 2GB 인스턴스에서 기본 힙(1GB)은 과함
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - shop-kafka-data:/var/lib/kafka/data
    # 포트를 외부에 열지 않음: app 컨테이너만 내부 네트워크로 접근

  volumes:
    shop-postgres-data:
    shop-kafka-data:

volumes:
  shop-postgres-data:
