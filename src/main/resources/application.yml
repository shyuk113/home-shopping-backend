spring:
  batch:
    job:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # 브로커 메타데이터를 기다리며 요청 스레드를 붙잡는 최대 시간 (기본 60초).
        # 브로커 장애가 Tomcat 스레드 고갈로 번지지 않도록 짧게 둔다.
        max.block.ms: 3000
        # 전송 실패를 빨리 알아야 Redis 보상(발급 기록 제거)도 빨라진다 (기본 120초).
        # delivery.timeout.ms >= linger.ms + request.timeout.ms 조건을 지켜야 함
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
    consumer:
      group-id: coupon-issue
      auto-offset-reset: earliest

# spring과 같은 레벨에 배치 (들여쓰기 주의!)
jwt:
  secret: ${JWT_SECRET} # 실제로는 아주 길고 복잡한 문자열 추천
  expiration: ${JWT_EXPIRATION:3600000} # 1시간 (밀리초 단위)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
payment:
  failure-alert:
    threshold: 5
    window-seconds: 60
    cooldown-seconds: 300