spring:
  batch:
    job:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379

# spring과 같은 레벨에 배치 (들여쓰기 주의!)
jwt:
  secret: ${JWT_SECRET} # 실제로는 아주 길고 복잡한 문자열 추천
  expiration: ${JWT_EXPIRATION:3600000} # 1시간 (밀리초 단위)
payment:
  failure-alert:
    threshold: 5
    window-seconds: 60
    cooldown-seconds: 300